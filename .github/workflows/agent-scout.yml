# Scout — propone idee di progetto. Gira il lunedi' mattina.
# Non scrive codice: apre solo issue etichettate "idea".

name: agent-scout

on:
  schedule:
    - cron: "0 6 * * 1"        # lunedi' 08:00 in Italia (06:00 UTC)
  workflow_dispatch:
    inputs:
      debug:
        description: Mostra l'output completo dell'agente nel log
        required: false
        default: false
        type: boolean

# I workflow riutilizzabili non ereditano i permessi: e' il chiamante che deve
# concederli, e _agent.yml non puo' chiedere piu' di quanto trova qui.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  scout:
    uses: ./.github/workflows/_agent.yml
    secrets: inherit
    with:
      agent: scout
      debug: ${{ inputs.debug || false }}
      prompt_file: prompts/scout.md
      prefetch_feed: true
      allowed_tools: Read,Grep,Glob,Bash(gh issue create:*),Bash(gh issue list:*)
