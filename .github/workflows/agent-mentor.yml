# Mentor — dopo la pubblicazione, scrive cosa hai imparato e cosa
# saresti in grado di raccontare a un colloquio.
#
# Lo lanci a mano dalla PWA, oppure lo chiama il Publisher via
# repository_dispatch quando la PR sul portfolio viene aperta.

name: agent-mentor

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Slug del progetto (es. realtime-collab-editor)
        required: true
        type: string
      project_repo:
        description: "Repo del progetto, formato owner/nome"
        required: true
        type: string
      debug:
        description: Mostra l'output completo dell'agente nel log
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [project-published]

# I workflow riutilizzabili non ereditano i permessi: e' il chiamante che deve
# concederli, e _agent.yml non puo' chiedere piu' di quanto trova qui.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  mentor:
    uses: ./.github/workflows/_agent.yml
    secrets: inherit
    with:
      agent: mentor
      debug: ${{ inputs.debug || false }}
      prompt_file: prompts/mentor.md
      vars: |
        SLUG=${{ inputs.slug || github.event.client_payload.slug }}
        PROJECT_REPO=${{ inputs.project_repo || github.event.client_payload.repo }}
      # Come per l'Architect: la whitelist costava piu' turni di quanti ne
      # risparmiasse. I limiti veri sono la deny-list in .claude/settings.json
      # e il fatto che il token della run vale solo per questo repo.
      allowed_tools: Read,Write,Edit,Grep,Glob,Bash