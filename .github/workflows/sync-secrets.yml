# I secrets di Actions non esistono a livello di account personale: vivono
# sui repository. Ogni repo creato dall'Architect nascerebbe quindi senza
# credenziale, e il suo Builder fallirebbe al primo giro.
#
# Questo workflow copia il segreto giusto in tutti i repo registrati in
# state/projects.json. Parte quando quel file cambia su main, cioe' subito
# dopo che hai mergiato la PR dell'Architect.
#
# Il valore del segreto non passa mai da un agente: sta solo in questo job.

name: sync-secrets

on:
  push:
    branches: [main]
    paths:
      - state/projects.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml

      - name: Leggi il provider
        id: cfg
        run: python3 scripts/officina.py outputs scout

      - name: Propaga la credenziale
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          PROVIDER: ${{ steps.cfg.outputs.provider }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZ_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZ_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZ_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail

          repos=$(python3 -c "
          import json
          d = json.load(open('state/projects.json'))
          print('\n'.join(p['repo'] for p in d.get('projects', []) if p.get('repo')))
          ")

          if [ -z "$repos" ]; then
            echo "Nessun repo di progetto registrato." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "| Repo | Esito |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            ok=true
            case "$PROVIDER" in
              subscription)
                gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo "$repo" --body "$OAUTH_TOKEN" || ok=false ;;
              api-key)
                gh secret set ANTHROPIC_API_KEY --repo "$repo" --body "$API_KEY" || ok=false ;;
              foundry)
                gh secret set AZURE_CLIENT_ID --repo "$repo" --body "$AZ_CLIENT" || ok=false
                gh secret set AZURE_TENANT_ID --repo "$repo" --body "$AZ_TENANT" || ok=false
                gh secret set AZURE_SUBSCRIPTION_ID --repo "$repo" --body "$AZ_SUB" || ok=false ;;
              *)
                echo "provider '$PROVIDER' sconosciuto"; exit 1 ;;
            esac
            if [ "$ok" = true ]; then
              echo "| \`$repo\` | aggiornato |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$repo\` | **fallito** — controlla GH_ADMIN_TOKEN |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$repos"
