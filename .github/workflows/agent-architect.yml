# Architect — trasforma un'idea approvata in un repo con i compiti dentro.
# Si sveglia quando aggiungi l'etichetta "idea:approved" a una issue
# (lo fa la PWA quando approvi, o tu a mano da GitHub).
#
# Il repo NON lo crea l'agente: lo crea il job "prepara" qui sotto, in bash.
# Due motivi. Primo, claude-code-action sostituisce GH_TOKEN con il token
# della propria GitHub App, che non puo' creare repository. Secondo, e piu'
# importante: cosi' GH_ADMIN_TOKEN non entra mai nel contesto di un modello.

name: agent-architect

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Numero della issue con l'idea da realizzare
        required: true
        type: string
      debug:
        description: Mostra l'output completo dell'agente nel log
        required: false
        default: false
        type: boolean

# I workflow riutilizzabili non ereditano i permessi: e' il chiamante che deve
# concederli, e _agent.yml non puo' chiedere piu' di quanto trova qui.
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  # ----------------------------------------------------------------------
  # 1. Crea e semina il repo del progetto. Nessun modello coinvolto.
  # ----------------------------------------------------------------------
  prepara:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.label.name == 'idea:approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slug: ${{ steps.crea.outputs.slug }}
      repo: ${{ steps.crea.outputs.repo }}
      issue: ${{ steps.crea.outputs.issue }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Crea il repo del progetto
        id: crea
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
          MODEL_SECRET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Manca il secret GH_ADMIN_TOKEN (PAT classico, scope repo + workflow)."
            exit 1
          fi

          title=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          echo "Idea #$ISSUE: $title"

          # titolo -> slug in kebab-case, senza il prefisso [idea]
          slug=$(python3 - "$title" <<'PY'
          import re, sys, unicodedata
          t = sys.argv[1]
          t = re.sub(r'^\s*\[[^\]]*\]\s*', '', t)
          t = unicodedata.normalize('NFKD', t).encode('ascii', 'ignore').decode()
          t = re.sub(r'[^a-zA-Z0-9]+', '-', t).strip('-').lower()
          print((t or 'progetto')[:40].strip('-'))
          PY
          )

          # se lo slug e' gia' preso, aggiungi un suffisso
          base="$slug"; n=2
          while gh repo view "$OWNER/$slug" >/dev/null 2>&1; do
            slug="$base-$n"; n=$((n + 1))
          done
          repo="$OWNER/$slug"
          echo "Repo: $repo"

          gh repo create "$repo" --public \
            --description "Progetto dell'Officina Agenti — idea #$ISSUE"

          # ---- scheletro iniziale -------------------------------------
          work=$(mktemp -d)
          mkdir -p "$work/.github/workflows"
          cp templates/project-CLAUDE.md "$work/CLAUDE.md"
          cp templates/project.gitignore "$work/.gitignore"
          cp templates/agent-builder.yml "$work/.github/workflows/agent-builder.yml"
          printf '# %s\n\nProgetto dell'"'"'Officina Agenti.\nIdea originale: %s/issues/%s\n' \
            "$title" "https://github.com/$GITHUB_REPOSITORY" "$ISSUE" > "$work/README.md"

          cd "$work"
          git init -q -b main
          git add -A
          git -c user.name=officina-bot \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Scheletro del progetto"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git"
          git push -q -u origin main
          cd - >/dev/null

          # ---- credenziale del modello --------------------------------
          if [ -n "${MODEL_SECRET:-}" ]; then
            gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo "$repo" --body "$MODEL_SECRET"
          elif [ -n "${API_KEY:-}" ]; then
            gh secret set ANTHROPIC_API_KEY --repo "$repo" --body "$API_KEY"
          fi

          # ---- protezione di main: gli agenti passano solo da PR ------
          gh api -X PUT "repos/$repo/branches/main/protection" --input - <<'JSON' || \
            echo "::warning::Branch protection non applicata, mettila a mano."
          {
            "required_status_checks": null,
            "enforce_admins": false,
            "required_pull_request_reviews": { "required_approving_review_count": 0 },
            "restrictions": null
          }
          JSON

          # ---- installa la Claude App sul repo nuovo -------------------
          # Senza questo, se l'App e' installata su "repository selezionati",
          # il repo appena creato non e' coperto e il Builder non puo'
          # scriverci. Meglio aggiungerlo qui che pretendere l'installazione
          # su tutti i repo dell'account.
          inst=$(gh api /user/installations \
                   --jq '.installations[] | select(.app_slug=="claude") | .id' 2>/dev/null | head -1 || true)
          if [ -n "${inst:-}" ]; then
            repo_id=$(gh api "repos/$repo" --jq .id)
            if gh api -X PUT "/user/installations/$inst/repositories/$repo_id" >/dev/null 2>&1; then
              echo "Claude App aggiunta a $repo"
            else
              echo "::warning::Non sono riuscito ad aggiungere la Claude App a $repo. \
          Se e' installata su 'All repositories' va bene lo stesso; altrimenti aggiungilo a mano."
            fi
          else
            echo "::warning::Claude App non trovata fra le installazioni di questo token."
          fi

          gh label create "agent:build" --repo "$repo" --color 1B8079 \
            --description "Compito pronto per il Builder" 2>/dev/null || true
          gh label create "agent:queued" --repo "$repo" --color CCCCCC \
            --description "In coda, non ancora sbloccato" 2>/dev/null || true

          {
            echo "slug=$slug"
            echo "repo=$repo"
            echo "issue=$ISSUE"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Repo creato"
            echo ""
            echo "[$repo](https://github.com/$repo) — dall'idea #$ISSUE."
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------------
  # 2. L'agente riempie il repo: README vero e compiti per il Builder.
  # ----------------------------------------------------------------------
  architect:
    needs: prepara
    uses: ./.github/workflows/_agent.yml
    secrets: inherit
    with:
      agent: architect
      debug: ${{ inputs.debug || false }}
      upload_dir: out
      prompt_file: prompts/architect.md
      vars: |
        ISSUE_NUMBER=${{ needs.prepara.outputs.issue }}
        OWNER=${{ github.repository_owner }}
        SLUG=${{ needs.prepara.outputs.slug }}
        PROJECT_REPO=${{ needs.prepara.outputs.repo }}
      # Bash senza whitelist: elencare i comandi permessi faceva sprecare
      # meta' dei turni in rifiuti (comandi composti, cat, touch, npm...).
      # I limiti veri sono altrove: branch protection, token con poco scope,
      # runner effimero, e la deny-list in .claude/settings.json.
      allowed_tools: Read,Write,Edit,Grep,Glob,Bash

  # ----------------------------------------------------------------------
  # 3. Pubblica cio' che l'agente ha prodotto.
  #
  #    Serve un job a se' perche' il token generato per l'agente vale solo
  #    per questo repo: scrivere in ciroperf/<progetto> richiede
  #    GH_ADMIN_TOKEN, che non deve mai entrare nel contesto di un modello.
  # ----------------------------------------------------------------------
  pubblica:
    needs: [prepara, architect]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: officina-output
          path: out

      - name: Pubblica nel repo del progetto
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          REPO: ${{ needs.prepara.outputs.repo }}
          SLUG: ${{ needs.prepara.outputs.slug }}
          ISSUE: ${{ needs.prepara.outputs.issue }}
        run: |
          set -euo pipefail

          test -f out/plan.json || { echo "::error::L'agente non ha prodotto out/plan.json"; exit 1; }
          test -d out/repo     || { echo "::error::L'agente non ha prodotto out/repo/"; exit 1; }

          branch="agent/setup"
          proj=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$proj"

          cp -R out/repo/. "$proj/"

          git -C "$proj" checkout -b "$branch"
          git -C "$proj" add -A
          git -C "$proj" -c user.name=officina-bot \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Imposta la struttura del progetto"
          git -C "$proj" push -q -u origin "$branch"

          pr=$(gh pr create --repo "$REPO" --base main --head "$branch" \
                 --title "Struttura del progetto" \
                 --body "Scheletro generato dall'Architect a partire dall'idea #${ISSUE}. Il codice arriva dal Builder, un compito alla volta.")
          echo "PR progetto: $pr"

          # ---- i compiti, dal piano dell'agente -----------------------
          python3 - "$REPO" "$ISSUE" <<'PY' > /tmp/issues.txt
          import json, subprocess, sys
          repo, issue = sys.argv[1], sys.argv[2]
          plan = json.load(open("out/plan.json", encoding="utf-8"))
          tasks = plan.get("tasks", [])
          if not 1 <= len(tasks) <= 12:
              sys.exit(f"plan.json: {len(tasks)} compiti, fuori dall'intervallo atteso")
          for i, t in enumerate(tasks):
              label = "agent:build" if i == 0 else "agent:queued"
              url = subprocess.run(
                  ["gh", "issue", "create", "--repo", repo, "--label", label,
                   "--title", t["title"], "--body", t["body"]],
                  capture_output=True, text=True, check=True).stdout.strip()
              print(f"- {label}: {url}")
          PY
          cat /tmp/issues.txt

          # ---- registro nel control plane ------------------------------
          python3 - "$REPO" "$SLUG" "$ISSUE" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          repo, slug, issue = sys.argv[1], sys.argv[2], int(sys.argv[3])
          plan = json.load(open("out/plan.json", encoding="utf-8"))
          state = json.load(open("state/projects.json", encoding="utf-8"))
          state["projects"] = [p for p in state.get("projects", []) if p.get("slug") != slug]
          state["projects"].append({
              "slug": slug,
              "title": plan.get("title", slug),
              "repo": repo,
              "stage": "building",
              "issue": issue,
              "skills": plan.get("skills", []),
              "portfolioPr": None,
          })
          state["updatedAt"] = datetime.now(timezone.utc).isoformat(timespec="seconds")
          json.dump(state, open("state/projects.json", "w", encoding="utf-8"),
                    indent=2, ensure_ascii=False)
          PY

          reg="agent/registro-${SLUG}"
          git config user.name officina-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$reg"
          git add state/projects.json
          git commit -q -m "Registra il progetto ${SLUG}"
          git push -q -u origin "$reg"
          reg_pr=$(gh pr create --base main --head "$reg" \
                     --title "Registra ${SLUG}" \
                     --body "Voce di registro per ${REPO}, dall'idea #${ISSUE}.")

          # ---- chiudi il cerchio ---------------------------------------
          gh issue comment "$ISSUE" --body "$(printf 'Progetto avviato: https://github.com/%s\n\nCompiti creati:\n%s\n\nPR struttura: %s\nPR registro: %s' \
            "$REPO" "$(cat /tmp/issues.txt)" "$pr" "$reg_pr")"
          gh issue close "$ISSUE"

          {
            echo "### Progetto avviato"
            echo ""
            echo "- Repo: [$REPO](https://github.com/$REPO)"
            echo "- PR struttura: $pr"
            echo "- PR registro: $reg_pr"
            echo ""
            cat /tmp/issues.txt
          } >> "$GITHUB_STEP_SUMMARY"
